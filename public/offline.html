<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Litaj Hardware</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center text-white">
    <div class="text-center px-6">
        <div class="text-6xl mb-6">📡</div>
        <h1 class="text-2xl font-bold mb-2">You're offline</h1>
        <p class="text-slate-400 mb-6">No internet connection. Sales logged while offline will sync automatically when you reconnect.</p>
        <button onclick="window.location.reload()" class="px-6 py-2 bg-orange-600 hover:bg-orange-700 rounded font-bold transition">Try again</button>
    </div>
    <script>
        window.addEventListener('online', () => window.location.reload());
    </script>
</body>
</html>
