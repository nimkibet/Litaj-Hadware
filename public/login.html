<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litaj Hardware — Login</title>
    <!-- Supabase config injected here (server renders these, never hardcoded in JS) -->
    <meta name="supa-url" content="https://sbpncxjddwontoemkuye.supabase.co">
    <meta name="supa-key" content="REPLACE_WITH_ANON_KEY">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#EA580C', hover: '#C2410C', light: '#FFF7ED', accent: '#F59E0B' }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .pin-dot { transition: all 0.15s ease; }
        .pin-dot.filled { background-color: #EA580C; transform: scale(1.1); }
        .key-btn { transition: all 0.1s ease; }
        .key-btn:active { transform: scale(0.93); }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-orange-950 flex items-center justify-center p-4">

    <div class="w-full max-w-sm">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-orange-600 shadow-2xl shadow-orange-900/50 mb-4">
                <span class="text-3xl font-black text-white tracking-tight">LH</span>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">LITAJ HARDWARE</h1>
            <p class="text-orange-300 text-sm font-medium mt-1">POS & Inventory System</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl shadow-black/40 overflow-hidden">
            <!-- Card Header -->
            <div class="bg-gradient-to-r from-orange-600 to-orange-700 px-6 py-4">
                <p class="text-white font-semibold text-sm text-center">Staff Authentication</p>
            </div>

            <div class="p-6">
                <!-- Username Field -->
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Username</label>
                    <input
                        id="inp-username"
                        type="text"
                        placeholder="e.g. admin or cashier1"
                        autocomplete="off"
                        class="w-full px-4 py-3 rounded-xl border border-slate-200 text-slate-800 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500 transition-all"
                    >
                </div>

                <!-- PIN Dots Display -->
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">PIN Code</label>
                    <div class="flex items-center justify-center space-x-3 py-3">
                        <div class="pin-dot w-4 h-4 rounded-full bg-slate-200" id="dot-1"></div>
                        <div class="pin-dot w-4 h-4 rounded-full bg-slate-200" id="dot-2"></div>
                        <div class="pin-dot w-4 h-4 rounded-full bg-slate-200" id="dot-3"></div>
                        <div class="pin-dot w-4 h-4 rounded-full bg-slate-200" id="dot-4"></div>
                    </div>
                </div>

                <!-- 10-Key Numpad -->
                <div class="grid grid-cols-3 gap-2 mb-4">
                    <!-- Numbers 1-9 -->
                    <template id="key-template">
                        <button class="key-btn h-14 rounded-xl bg-slate-50 border border-slate-200 text-slate-800 font-bold text-xl hover:bg-orange-50 hover:border-orange-300 hover:text-orange-700 active:bg-orange-100"></button>
                    </template>
                </div>

                <!-- Error Message -->
                <div id="login-error" class="hidden text-center text-red-600 text-sm font-semibold bg-red-50 rounded-xl px-4 py-3 mb-3">
                    Invalid username or PIN. Try again.
                </div>

                <!-- Login Status -->
                <div id="login-loading" class="hidden text-center text-orange-600 text-sm font-semibold py-2">
                    Authenticating...
                </div>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-slate-500 text-xs mt-6">
            Litaj Hardware POS v1.0 &nbsp;·&nbsp; Secure Terminal
        </p>
    </div>

    <script type="module" src="/js/login.js"></script>
</body>
</html>
